<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Django API Test Studio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.7);
            --border-color: rgba(255, 255, 255, 0.1);
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --accent-cyan: #06b6d4;
            --accent-green: #10b981;
            --accent-orange: #f59e0b;
            --accent-red: #ef4444;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-dark);
            background-image: 
                radial-gradient(at 0% 0%, rgba(99, 102, 241, 0.15) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(6, 182, 212, 0.12) 0px, transparent 50%);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border-color);
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo-group {
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .logo-badge {
            background: linear-gradient(135deg, var(--primary), var(--accent-cyan));
            color: white;
            font-weight: 700;
            padding: 0.35rem 0.65rem;
            border-radius: 8px;
            font-size: 0.85rem;
            letter-spacing: 0.5px;
        }

        h1 {
            font-size: 1.25rem;
            font-weight: 600;
            letter-spacing: -0.02em;
        }

        .server-config {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .server-input {
            padding: 0.35rem 0.65rem;
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            color: var(--text-main);
            font-family: 'Fira Code', monospace;
            font-size: 0.85rem;
            outline: none;
            width: 220px;
        }

        .auth-status-bar {
            display: flex;
            align-items: center;
            gap: 1rem;
            background: rgba(255, 255, 255, 0.05);
            padding: 0.5rem 1rem;
            border-radius: 9999px;
            border: 1px solid var(--border-color);
            font-size: 0.85rem;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: var(--accent-red);
            box-shadow: 0 0 8px var(--accent-red);
        }

        .status-dot.active {
            background-color: var(--accent-green);
            box-shadow: 0 0 8px var(--accent-green);
        }

        main {
            display: grid;
            grid-template-columns: 320px 1fr;
            gap: 1.5rem;
            padding: 1.5rem 2rem;
            flex: 1;
            max-width: 1600px;
            width: 100%;
            margin: 0 auto;
        }

        .sidebar {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .card {
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 1.25rem;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
        }

        .card-title {
            font-size: 0.9rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-muted);
            margin-bottom: 1rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .endpoint-group {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .endpoint-btn {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            padding: 0.65rem 0.85rem;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid transparent;
            border-radius: 8px;
            color: var(--text-main);
            font-family: inherit;
            font-size: 0.875rem;
            cursor: pointer;
            text-align: left;
            transition: all 0.2s ease;
        }

        .endpoint-btn:hover {
            background: rgba(255, 255, 255, 0.08);
            border-color: var(--border-color);
        }

        .method-tag {
            font-size: 0.7rem;
            font-weight: 700;
            padding: 0.15rem 0.4rem;
            border-radius: 4px;
            font-family: 'Fira Code', monospace;
            width: 48px;
            text-align: center;
        }

        .method-get { background: rgba(16, 185, 129, 0.2); color: var(--accent-green); border: 1px solid var(--accent-green); }
        .method-post { background: rgba(99, 102, 241, 0.2); color: #818cf8; border: 1px solid var(--primary); }
        .method-put { background: rgba(245, 158, 11, 0.2); color: var(--accent-orange); border: 1px solid var(--accent-orange); }
        .method-patch { background: rgba(6, 182, 212, 0.2); color: var(--accent-cyan); border: 1px solid var(--accent-cyan); }
        .method-delete { background: rgba(239, 68, 68, 0.2); color: var(--accent-red); border: 1px solid var(--accent-red); }

        .workspace {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .url-bar-container {
            display: flex;
            gap: 0.75rem;
        }

        .method-select {
            padding: 0.75rem 1rem;
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-main);
            font-weight: 600;
            font-family: 'Fira Code', monospace;
            cursor: pointer;
            outline: none;
        }

        .url-input {
            flex: 1;
            padding: 0.75rem 1rem;
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-main);
            font-family: 'Fira Code', monospace;
            font-size: 0.9rem;
            outline: none;
        }

        .url-input:focus, .method-select:focus, input:focus, textarea:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 2px rgba(99, 102, 241, 0.2);
        }

        .btn-send {
            padding: 0.75rem 1.75rem;
            background: linear-gradient(135deg, var(--primary), var(--primary-hover));
            border: none;
            border-radius: 8px;
            color: white;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            transition: opacity 0.2s ease, transform 0.1s ease;
        }

        .btn-send:hover {
            opacity: 0.9;
        }

        .btn-send:active {
            transform: scale(0.98);
        }

        .section-tabs {
            display: flex;
            gap: 1rem;
            border-bottom: 1px solid var(--border-color);
            margin-bottom: 1rem;
        }

        .tab-btn {
            padding: 0.5rem 0.25rem;
            background: none;
            border: none;
            border-bottom: 2px solid transparent;
            color: var(--text-muted);
            font-weight: 500;
            cursor: pointer;
            font-size: 0.9rem;
        }

        .tab-btn.active {
            color: var(--primary);
            border-bottom-color: var(--primary);
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 0.35rem;
        }

        label {
            font-size: 0.8rem;
            color: var(--text-muted);
            font-weight: 500;
        }

        input[type="text"], input[type="password"], input[type="email"], select, textarea {
            padding: 0.6rem 0.75rem;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            color: var(--text-main);
            font-family: inherit;
            font-size: 0.875rem;
            outline: none;
        }

        textarea {
            font-family: 'Fira Code', monospace;
            min-height: 140px;
            resize: vertical;
        }

        .response-header-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.75rem;
        }

        .status-badge {
            font-family: 'Fira Code', monospace;
            font-size: 0.8rem;
            padding: 0.25rem 0.5rem;
            border-radius: 4px;
            font-weight: 600;
        }

        .status-2xx { background: rgba(16, 185, 129, 0.2); color: var(--accent-green); border: 1px solid var(--accent-green); }
        .status-4xx { background: rgba(245, 158, 11, 0.2); color: var(--accent-orange); border: 1px solid var(--accent-orange); }
        .status-5xx { background: rgba(239, 68, 68, 0.2); color: var(--accent-red); border: 1px solid var(--accent-red); }

        pre {
            background: rgba(15, 23, 42, 0.9);
            border: 1px solid var(--border-color);
            padding: 1rem;
            border-radius: 8px;
            font-family: 'Fira Code', monospace;
            font-size: 0.85rem;
            overflow-x: auto;
            color: #e2e8f0;
            max-height: 350px;
        }

        .quick-fill-btn {
            font-size: 0.75rem;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-color);
            color: var(--text-muted);
            padding: 0.2rem 0.5rem;
            border-radius: 4px;
            cursor: pointer;
        }

        .quick-fill-btn:hover {
            color: var(--text-main);
            background: rgba(255, 255, 255, 0.1);
        }
    </style>
</head>
<body>
    <header>
        <div class="logo-group">
            <span class="logo-badge">DJANGO DRF</span>
            <h1>API Test Studio</h1>
        </div>

        <div class="server-config">
            <label for="serverBase">Backend Host:</label>
            <input type="text" id="serverBase" class="server-input" value="http://127.0.0.1:8000">
        </div>

        <div class="auth-status-bar">
            <div id="statusDot" class="status-dot"></div>
            <span id="authStatusText">Not Authenticated</span>
            <button class="quick-fill-btn" onclick="clearToken()">Clear JWT</button>
        </div>
    </header>

    <main>
        <div class="sidebar">
            <div class="card">
                <div class="card-title">Authentication</div>
                <div class="endpoint-group">
                    <button class="endpoint-btn" onclick="selectPreset('POST', '/api/auth/token/', 'auth')">
                        <span class="method-tag method-post">POST</span>
                        <span>Obtain JWT Token</span>
                    </button>
                    <button class="endpoint-btn" onclick="selectPreset('POST', '/api/auth/token/refresh/', 'refresh')">
                        <span class="method-tag method-post">POST</span>
                        <span>Refresh Token</span>
                    </button>
                </div>
            </div>

            <div class="card">
                <div class="card-title">Users Endpoints</div>
                <div class="endpoint-group">
                    <button class="endpoint-btn" onclick="selectPreset('GET', '/api/users/', 'user_list')">
                        <span class="method-tag method-get">GET</span>
                        <span>List Users</span>
                    </button>
                    <button class="endpoint-btn" onclick="selectPreset('POST', '/api/users/', 'user_create')">
                        <span class="method-tag method-post">POST</span>
                        <span>Create User</span>
                    </button>
                    <button class="endpoint-btn" onclick="selectPreset('GET', '/api/users/1/', 'user_detail')">
                        <span class="method-tag method-get">GET</span>
                        <span>User Detail</span>
                    </button>
                </div>
            </div>

            <div class="card">
                <div class="card-title">Projects Endpoints</div>
                <div class="endpoint-group">
                    <button class="endpoint-btn" onclick="selectPreset('GET', '/api/projects/', 'project_list')">
                        <span class="method-tag method-get">GET</span>
                        <span>List Projects</span>
                    </button>
                    <button class="endpoint-btn" onclick="selectPreset('POST', '/api/projects/', 'project_create')">
                        <span class="method-tag method-post">POST</span>
                        <span>Create Project</span>
                    </button>
                    <button class="endpoint-btn" onclick="selectPreset('GET', '/api/projects/1/', 'project_detail')">
                        <span class="method-tag method-get">GET</span>
                        <span>Project Detail</span>
                    </button>
                </div>
            </div>

            <div class="card">
                <div class="card-title">Tasks Endpoints</div>
                <div class="endpoint-group">
                    <button class="endpoint-btn" onclick="selectPreset('GET', '/api/tasks/', 'task_list')">
                        <span class="method-tag method-get">GET</span>
                        <span>List Tasks</span>
                    </button>
                    <button class="endpoint-btn" onclick="selectPreset('POST', '/api/tasks/', 'task_create')">
                        <span class="method-tag method-post">POST</span>
                        <span>Create Task</span>
                    </button>
                    <button class="endpoint-btn" onclick="selectPreset('GET', '/api/tasks/1/', 'task_detail')">
                        <span class="method-tag method-get">GET</span>
                        <span>Task Detail</span>
                    </button>
                </div>
            </div>
        </div>

        <div class="workspace">
            <div class="card">
                <div class="url-bar-container">
                    <select id="httpMethod" class="method-select">
                        <option value="GET">GET</option>
                        <option value="POST">POST</option>
                        <option value="PUT">PUT</option>
                        <option value="PATCH">PATCH</option>
                        <option value="DELETE">DELETE</option>
                    </select>
                    <input type="text" id="endpointUrl" class="url-input" value="/api/users/">
                    <button class="btn-send" onclick="sendRequest()">Send Request</button>
                </div>
            </div>

            <div class="card">
                <div class="section-tabs">
                    <button class="tab-btn active" onclick="switchTab('bodyTab', this)">JSON Request Body</button>
                    <button class="tab-btn" onclick="switchTab('headersTab', this)">Headers</button>
                </div>

                <div id="bodyTab" class="tab-content">
                    <div class="form-group">
                        <textarea id="jsonPayload" placeholder='{ "username": "admin", "password": "password" }'></textarea>
                    </div>
                </div>

                <div id="headersTab" class="tab-content" style="display:none;">
                    <div class="form-group">
                        <label>Authorization Header</label>
                        <input type="text" id="authHeader" placeholder="Bearer <your-access-token>">
                    </div>
                </div>
            </div>

            <div class="card">
                <div class="response-header-bar">
                    <div class="card-title" style="margin:0;">Response</div>
                    <div id="statusBadge" class="status-badge" style="display:none;"></div>
                </div>
                <pre id="responseOutput">// Response JSON output will appear here...</pre>
            </div>
        </div>
    </main>

    <script>
        let jwtAccessToken = localStorage.getItem('jwt_access_token') || '';
        let jwtRefreshToken = localStorage.getItem('jwt_refresh_token') || '';

        updateAuthStatus();

        function updateAuthStatus() {
            const dot = document.getElementById('statusDot');
            const text = document.getElementById('authStatusText');
            const headerInput = document.getElementById('authHeader');

            if (jwtAccessToken) {
                dot.classList.add('active');
                text.textContent = 'Authenticated (JWT Saved)';
                headerInput.value = 'Bearer ' + jwtAccessToken;
            } else {
                dot.classList.remove('active');
                text.textContent = 'Not Authenticated';
                headerInput.value = '';
            }
        }

        function clearToken() {
            localStorage.removeItem('jwt_access_token');
            localStorage.removeItem('jwt_refresh_token');
            jwtAccessToken = '';
            jwtRefreshToken = '';
            updateAuthStatus();
        }

        function switchTab(tabId, btn) {
            document.querySelectorAll('.tab-content').forEach(el => el.style.display = 'none');
            document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
            document.getElementById(tabId).style.display = 'block';
            btn.classList.add('active');
        }

        function selectPreset(method, urlPath, type) {
            document.getElementById('httpMethod').value = method;
            document.getElementById('endpointUrl').value = urlPath;
            
            const payloadInput = document.getElementById('jsonPayload');

            if (type === 'auth') {
                payloadInput.value = JSON.stringify({ username: "admin", password: "password123" }, null, 2);
            } else if (type === 'refresh') {
                payloadInput.value = JSON.stringify({ refresh: jwtRefreshToken || "<refresh-token>" }, null, 2);
            } else if (type === 'user_create') {
                payloadInput.value = JSON.stringify({ username: "john_doe", email: "john@example.com", password: "securepassword123" }, null, 2);
            } else if (type === 'project_create') {
                payloadInput.value = JSON.stringify({ name: "Alpha Project", description: "Awesome test project" }, null, 2);
            } else if (type === 'task_create') {
                payloadInput.value = JSON.stringify({ title: "Build Test UI", project: "<PROJECT_UUID>", status: "TO_DO", priority: "HIGH" }, null, 2);
            } else {
                payloadInput.value = '';
            }
        }

        async function sendRequest() {
            const serverBase = document.getElementById('serverBase').value.replace(/\/$/, '');
            const method = document.getElementById('httpMethod').value;
            const endpointPath = document.getElementById('endpointUrl').value.trim();
            const fullUrl = serverBase + (endpointPath.startsWith('/') ? endpointPath : '/' + endpointPath);

            const bodyContent = document.getElementById('jsonPayload').value.trim();
            const responseOutput = document.getElementById('responseOutput');
            const statusBadge = document.getElementById('statusBadge');

            responseOutput.textContent = 'Sending request...';
            statusBadge.style.display = 'none';

            const headers = {
                'Content-Type': 'application/json'
            };

            const customAuth = document.getElementById('authHeader').value.trim();
            if (customAuth) {
                headers['Authorization'] = customAuth;
            } else if (jwtAccessToken) {
                headers['Authorization'] = 'Bearer ' + jwtAccessToken;
            }

            const options = { method, headers };

            if (['POST', 'PUT', 'PATCH'].includes(method) && bodyContent) {
                try {
                    options.body = bodyContent;
                } catch (e) {
                    alert('Invalid JSON in request body');
                    return;
                }
            }

            try {
                const res = await fetch(fullUrl, options);
                statusBadge.style.display = 'inline-block';
                statusBadge.textContent = `${res.status} ${res.statusText}`;

                if (res.status >= 200 && res.status < 300) {
                    statusBadge.className = 'status-badge status-2xx';
                } else if (res.status >= 400 && res.status < 500) {
                    statusBadge.className = 'status-badge status-4xx';
                } else {
                    statusBadge.className = 'status-badge status-5xx';
                }

                let data;
                const contentType = res.headers.get('content-type');
                if (contentType && contentType.includes('application/json')) {
                    data = await res.json();
                    responseOutput.textContent = JSON.stringify(data, null, 2);

                    // Auto-save tokens if obtained
                    if (endpointPath.includes('/auth/token/') && data.access) {
                        localStorage.setItem('jwt_access_token', data.access);
                        jwtAccessToken = data.access;
                        if (data.refresh) {
                            localStorage.setItem('jwt_refresh_token', data.refresh);
                            jwtRefreshToken = data.refresh;
                        }
                        updateAuthStatus();
                    }
                } else {
                    const text = await res.text();
                    responseOutput.textContent = text || '(No Content)';
                }
            } catch (err) {
                statusBadge.style.display = 'inline-block';
                statusBadge.textContent = 'ERROR';
                statusBadge.className = 'status-badge status-5xx';
                responseOutput.textContent = `Fetch Error: ${err.message}`;
            }
        }
    </script>
</body>
</html>
